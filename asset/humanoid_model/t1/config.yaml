bone_mapping:
  # Booster T1 (Booster naming; refs GMR ik_configs/bvh_seed_to_t1_29dof.json).
  # Robot root body is 'Trunk' (floating base); human pelvis maps to 'Waist'.
  # Left Leg
  - ['pelvis', 'left_hip', 'Waist', 'Hip_Yaw_Left']
  - ['left_hip', 'left_knee', 'Hip_Yaw_Left', 'Shank_Left']
  - ['left_knee', 'left_ankle', 'Shank_Left', 'Ankle_Cross_Left']
  # Right Leg
  - ['pelvis', 'right_hip', 'Waist', 'Hip_Yaw_Right']
  - ['right_hip', 'right_knee', 'Hip_Yaw_Right', 'Shank_Right']
  - ['right_knee', 'right_ankle', 'Shank_Right', 'Ankle_Cross_Right']
  # Left Arm
  - ['pelvis', 'left_shoulder', 'Trunk', 'AL2']
  - ['left_shoulder', 'left_elbow', 'AL2', 'AL3']
  - ['left_elbow', 'left_wrist', 'AL3', 'left_hand_link']
  # Right Arm
  - ['pelvis', 'right_shoulder', 'Trunk', 'AR2']
  - ['right_shoulder', 'right_elbow', 'AR2', 'AR3']
  - ['right_elbow', 'right_wrist', 'AR3', 'right_hand_link']

  # Hand direction bones -> give Elbow_Yaw a direction constraint (tip fix)
  - ['left_wrist', 'left_middle1', 'left_hand_link', 'left_hand_tip_keypoint']
  - ['right_wrist', 'right_middle1', 'right_hand_link', 'right_hand_tip_keypoint']

